name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 的权限：读代码、写 Pages、签发部署用的 OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的 push 会取消进行中的旧构建
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 要求 Node 20.19+ / 22.12+
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # 仓库还没开 Pages 时自动启用，省得手动去 Settings 里点
          # 若 GITHUB_TOKEN 权限不足，这一步仍会失败，需要手动开启（见 README）
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
